name: ci-cd-service-order-billing-service

on:
  pull_request:
  push:
    branches: [main, homolog, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  API_IMAGE_NAME: service-order-billing-service
  K8S_NAMESPACE: service-order
  RENDERED_K8S_DIR: .rendered-k8s

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --dev
      - run: make lint
      - name: Run tests with coverage
        env:
          ENVIRONMENT: development
          APP_RUNTIME_MODE: memory
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET: "test-admin-secret-with-enough-length"
          CUSTOMER_JWT_SECRET: "test-customer-secret-with-enough-length"
          CUSTOMER_JWT_ISSUER: "service-order-auth-lambda/test"
          JWT_ALGORITHM: "HS256"
          JWT_EXPIRATION_MINUTES: "60"
          APPROVAL_TOKEN_SECRET: "test-approval-secret-with-enough-length"
          APPROVAL_TOKEN_TTL_MINUTES: "60"
          EMAIL_PROVIDER: "NOOP"
          OTEL_ENABLED: "false"
          DD_TRACE_ENABLED: "false"
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
        run: make test-cov
      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Validate rendered manifests
        run: |
          TMP_DIR="$(mktemp -d)"
          ENV_FILE="${TMP_DIR}/k8s.env"
          OUTPUT_DIR="${TMP_DIR}/rendered-k8s"
          cat <<'VAR' > "${ENV_FILE}"
          APP_NAME=service-order-billing-service
          APP_VERSION=3.0.0
          ENVIRONMENT=production
          APP_RUNTIME_MODE=real
          LOG_LEVEL=INFO
          LOG_JSON=true
          EMAIL_PROVIDER=NOOP
          DATABASE_URL=postgresql+asyncpg://user:pass@localhost:5432/service_order_db
          MONGODB_URL=mongodb://mongo:27017/service_order
          RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/%2F
          RABBITMQ_EXCHANGE=service-order.events
          RABBITMQ_ROUTING_KEY=service-order.billing
          RABBITMQ_QUEUE=service-order.billing.events
          MERCADO_PAGO_ACCESS_TOKEN=mp-test-token-placeholder
          MERCADO_PAGO_API_BASE_URL=https://api.mercadopago.com
          MERCADO_PAGO_SUCCESS_URL=https://api.example.com/payments/success
          MERCADO_PAGO_FAILURE_URL=https://api.example.com/payments/failure
          MERCADO_PAGO_PENDING_URL=https://api.example.com/payments/pending
          APP_BASE_URL=https://api.example.com/api
          CORS_ALLOWED_ORIGINS=https://app.example.com
          TRUSTED_HOSTS=api.example.com
          JWT_SECRET=jwt-secret-value-with-32-characters
          CUSTOMER_JWT_SECRET=customer-secret-value-with-32-characters
          CUSTOMER_JWT_ISSUER=service-order-auth-lambda/production
          APPROVAL_TOKEN_SECRET=approval-secret-value-with-32-chars
          JWT_ALGORITHM=HS256
          JWT_EXPIRATION_MINUTES=60
          APPROVAL_TOKEN_TTL_MINUTES=60
          OTEL_ENABLED=false
          OTEL_SERVICE_NAME=service-order-billing-service
          OTEL_EXPORTER_OTLP_ENDPOINT=
          DD_TRACE_ENABLED=false
          DD_SERVICE=service-order-billing-service
          DD_ENV=production
          DD_VERSION=3.0.0
          DD_API_KEY=dd-api-key-placeholder-1234567890
          HEALTHCHECK_TIMEOUT_SECONDS=5
          VAR
          python3 scripts/deploy/render_k8s_manifests.py --env-file "${ENV_FILE}" --output-dir "${OUTPUT_DIR}" --image ghcr.io/example/service-order-billing-service:sha-test
  build-publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image_ref=ghcr.io/${owner}/${{ env.API_IMAGE_NAME }}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker build -t "${{ steps.meta.outputs.image_ref }}" . && docker push "${{ steps.meta.outputs.image_ref }}"
  deploy:
    if: github.event_name != 'pull_request'
    needs: build-publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env file
        run: printf '%s' "${{ secrets.APP_ENV }}" > .env.deploy
      - name: Render manifests
        run: |
          python3 scripts/deploy/render_k8s_manifests.py \
            --env-file .env.deploy \
            --output-dir "${{ env.RENDERED_K8S_DIR }}" \
            --image "${{ needs.build-publish.outputs.image_ref }}"     
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -p "${{ vars.EC2_PORT }}" "${{ vars.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy rendered manifests to EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            -p "${{ vars.EC2_PORT }}" \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}" \
            "rm -rf /home/${{ vars.EC2_USER }}/.rendered-k8s && mkdir -p /home/${{ vars.EC2_USER }}/.rendered-k8s"

          scp -i ~/.ssh/ec2_key.pem \
            -P "${{ vars.EC2_PORT }}" \
            -r "${{ env.RENDERED_K8S_DIR }}/." \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:/home/${{ vars.EC2_USER }}/.rendered-k8s/"
      - name: Apply manifests on k3s
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            -p "${{ vars.EC2_PORT }}" \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}" <<'EOF'
          set -euo pipefail

          kubectl apply -f /home/ec2-user/.rendered-k8s/namespace.yaml
          kubectl apply -f /home/ec2-user/.rendered-k8s/configmap.rendered.yaml
          kubectl apply -f /home/ec2-user/.rendered-k8s/secret.rendered.yaml

          DATABASE_URL_API="$(kubectl get secret -n service-order service-order-billing-service-secret -o jsonpath='{.data.DATABASE_URL}' | base64 -d)"
          DATABASE_URL_MIGRATION="$(printf '%s' "$DATABASE_URL_API" | sed 's/?ssl=require/?sslmode=require/g')"

          kubectl create secret generic service-order-billing-service-migrate-secret \
            -n service-order \
            --from-literal=DATABASE_URL="$DATABASE_URL_MIGRATION" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete job -n service-order service-order-billing-service-migrate --ignore-not-found

          kubectl patch -n service-order -f /home/ec2-user/.rendered-k8s/job-migrate.yaml \
            --local=true \
            --type='json' \
            -p='[
              {
                "op": "add",
                "path": "/spec/template/spec/containers/0/envFrom/-",
                "value": {
                  "secretRef": {
                    "name": "service-order-billing-service-migrate-secret"
                  }
                }
              }
            ]' \
            -o yaml > /tmp/job-migrate.yaml
          kubectl apply -f /tmp/job-migrate.yaml
          kubectl wait --for=condition=complete job/service-order-billing-service-migrate -n service-order --timeout=300s

          kubectl apply -f /home/ec2-user/.rendered-k8s/deployment.yaml
          kubectl apply -f /home/ec2-user/.rendered-k8s/deployment-worker.yaml
          kubectl apply -f /home/ec2-user/.rendered-k8s/service.yaml
          kubectl apply -f /home/ec2-user/.rendered-k8s/hpa.yaml

          if [ -f /home/ec2-user/.rendered-k8s/ingress.yaml ]; then
            kubectl apply -f /home/ec2-user/.rendered-k8s/ingress.yaml
            kubectl patch ingress service-order-billing-service \
              -n service-order \
              --type='json' \
              -p='[
                {
                  "op": "replace",
                  "path": "/spec/rules/0/http/paths/0/path",
                  "value": "/"
                }
              ]' || true
          fi

          kubectl rollout status deployment/service-order-billing-service -n service-order --timeout=300s
          kubectl rollout status deployment/service-order-billing-service-worker -n service-order --timeout=300s
          kubectl get pods -n service-order
          kubectl get svc -n service-order
          kubectl get ingress -n service-order || true
          EOF
      - name: Smoke test public API
        run: |
          for i in {1..12}; do
            if curl -f "http://${{ vars.EC2_HOST }}/health" && \
               curl -f "http://${{ vars.EC2_HOST }}/health/ready"; then
              echo "Public API smoke test passed"
              exit 0
            fi

            echo "Public API not ready yet. Attempt ${i}/12"
            sleep 10
          done

          echo "Public API smoke test failed"
          exit 1


