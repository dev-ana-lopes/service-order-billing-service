apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: service-order-billing-service
  namespace: service-order
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service-order-billing-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

