apiVersion: batch/v1
kind: Job
metadata:
  name: service-order-billing-service-migrate
  namespace: service-order
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: __API_IMAGE__
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: service-order-billing-service-config
            - secretRef:
                name: service-order-billing-service-secret
          command:
            - alembic
            - -c
            - alembic/alembic.ini
            - upgrade
            - head

