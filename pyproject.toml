[project]
name = "service-order-billing-service"
version = "1.0.0"
description = "Billing service skeleton for FIAP Phase 4"
authors = [{name = "service-order-billing-service", email = "dev.anajulia@outlook.com.br"}]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.24.0,<0.25.0",
    "sqlalchemy>=2.0.23,<3.0.0",
    "psycopg[binary]>=3.1.13,<4.0.0",
    "alembic>=1.12.1,<2.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib>=1.7.4,<2.0.0",
    "email-validator>=2.1.0,<3.0.0",
    "python-multipart>=0.0.6,<0.0.7",
    "asyncpg>=0.31.0,<0.32.0",
    "prometheus-client>=0.21.0,<0.22.0",
    "opentelemetry-api>=1.27.0,<2.0.0",
    "opentelemetry-sdk>=1.27.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1.0.0",
    "pika>=1.3.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3,<8.0.0",
    "pytest-asyncio>=0.21.1,<0.22.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-bdd>=7.0.0,<8.0.0",
    "black>=23.12.0,<24.0.0",
    "flake8>=6.1.0,<7.0.0",
    "isort>=5.13.2,<6.0.0",
    "httpx>=0.25.2,<0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 89
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 89

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end API and email workflow tests",
    "integration: tests that exercise external integrations",
    "mailhog: local end-to-end tests against MailHog and a running stack",
    "testmail: live tests that query the Testmail API",
]


